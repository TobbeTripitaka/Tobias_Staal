<!DOCTYPE html>
<!-- GENERATED by tools/build.py from data/records.csv, data/settings.yaml and templates/index.html.
     Edit those files, not this one. -->
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><<name>> — <<position>></title>
<meta name="description" content="<<name>>, <<position>>, <<location>>. Research, publications, CV and collaborations.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#d6d4d0;          /* muted warm grey */
  --surface:#fbfaf8;
  --surface-2:#f2f0ec;
  --text:#2b2b2b;
  --text-2:#555;
  --muted:#8a8782;
  --border:#e3e0da;
  --accent:#dc3522;      /* CV orange-red */
  --accent-soft:rgba(220,53,34,.08);
  --yellow:#e3b23c;      /* secondary, used sparingly */
  --mono:'SF Mono','Fira Code','Roboto Mono',monospace;
  --r:4px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:15px;-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.65}
a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .2s}
a:hover{border-bottom-color:var(--yellow)}
.container{display:flex;height:100vh;gap:1px;max-width:1800px;margin:0 auto;background:var(--border)}
.col{flex:1;background:var(--surface);overflow-y:auto;padding:48px 40px}
.col::-webkit-scrollbar{width:5px}.col::-webkit-scrollbar-thumb{background:#ccc;border-radius:3px}
.left{flex:0.9;background:var(--surface-2)}

/* left column */
.intro{margin-bottom:36px;max-width:680px}
.intro h2,.block h3,.links h3{font-size:.7rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:16px}
.intro p{color:var(--text-2);font-size:.95rem;line-height:1.8}
figure{margin:0 0 18px}
figure img{width:100%;max-height:340px;object-fit:cover;display:block;border-radius:var(--r);filter:saturate(.92)}
figcaption{text-align:right;font-size:.7rem;color:var(--muted);margin-top:4px;letter-spacing:.02em}
.links ul{list-style:none}
.links li{margin-bottom:12px;font-size:.88rem}
.lbl{display:block;font-family:var(--mono);font-size:.7rem;color:var(--muted);letter-spacing:.04em}

/* header */
.head{display:flex;gap:24px;align-items:center;padding-bottom:28px;margin-bottom:24px;border-bottom:1px solid var(--border)}
.head img{width:96px;height:96px;border-radius:50%;object-fit:cover;border:2px solid #444;flex:none}
.head h1{font-size:2.2rem;line-height:1.1;font-weight:200;color:#555;letter-spacing:-.01em}
.head h1 b{font-weight:700;color:#2b2b2b}
.head .pos{font-size:.72rem;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.14em;margin-top:6px}
.head .loc{font-size:.8rem;color:var(--muted);font-style:italic}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{font-size:.75rem;font-weight:500;padding:5px 12px;border:1px solid var(--border);border-radius:999px;color:var(--text);background:#fff}
.btn:hover{border-color:var(--accent);color:var(--accent)}
nav.toc{display:flex;flex-wrap:wrap;gap:4px 14px;margin-bottom:34px;font-size:.75rem}
nav.toc a{color:var(--muted)}
nav.toc a:hover{color:var(--accent)}

/* lists */
.block{margin-bottom:40px}
.block h3{padding-bottom:8px;border-bottom:1px solid var(--border);position:relative}
.block h3::after{content:"";position:absolute;left:0;bottom:-1px;width:28px;height:2px;background:var(--yellow)}
.list{list-style:none}
.item{display:grid;grid-template-columns:7.2rem 1fr;gap:14px;margin-bottom:14px;font-size:.88rem;line-height:1.6;color:var(--text-2)}
.when{font-family:var(--mono);font-size:.72rem;font-weight:600;color:var(--muted);padding-top:2px;letter-spacing:.02em}
.what strong{color:var(--text);font-weight:600}
.what b{color:var(--text);font-weight:500}
.note{display:block;color:var(--muted);font-size:.84rem}
footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--border);font-size:.72rem;color:var(--muted)}

@media (max-width:1000px){
  .container{flex-direction:column;height:auto;gap:0}
  .col{overflow:visible;padding:32px 22px}
  .right{order:-1}
}
@media (max-width:600px){
  html{font-size:14px}
  .item{grid-template-columns:1fr;gap:0}
  .head{flex-direction:column;align-items:flex-start}
}
@media print{.container{flex-direction:column;height:auto}.col{overflow:visible}}
</style>
</head>
<body>
<div class="container">

  <!-- Left column: introduction, photos, links -->
  <div class="col left">
<<intro_blocks>>
    <section class="links">
      <h3>Online profiles</h3>
      <ul>
<<links>>
      </ul>
    </section>
  </div>

  <!-- Right column: header, downloads, everything from data/records.csv -->
  <div class="col right">
    <header class="head">
      <img src="<<photo>>" alt="Portrait of <<name>>">
      <div>
        <h1><<first_name>> <b><<last_name>></b></h1>
        <div class="pos"><<position>></div>
        <div class="loc"><<location>></div>
        <div class="btns">
<<downloads>>
        </div>
      </div>
    </header>
    <nav class="toc">
<<nav>>
    </nav>
<<sections>>
    <footer>Updated <<updated>>. Generated from one shared record; the same entries appear in the CVs and the publication list.</footer>
  </div>

</div>
</body>
</html>
